name: Veille quotidienne

# Ouagadougou est en UTC+0 toute l'année : 06:15 UTC = 06:15 à Ouaga.
# Chaque jour : collecte. Le lundi : bulletin hebdo. Le 1er du mois : bilan mensuel
# (selon `frequence` dans config/config.yaml).
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      commande:
        description: "Action à lancer"
        type: choice
        default: planifie
        options:
          - planifie
          - collecter
          - bulletin-hebdo
          - bulletin-mensuel
          - test-envoi

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'agent
        run: |
          case "${{ inputs.commande || 'planifie' }}" in
            planifie)          python -m veille planifie ;;
            collecter)         python -m veille collecter ;;
            bulletin-hebdo)    python -m veille bulletin --periode hebdo --envoyer ;;
            bulletin-mensuel)  python -m veille bulletin --periode mensuel --envoyer ;;
            test-envoi)        python -m veille test-envoi ;;
          esac

      - name: Sauvegarder la base et les bulletins
        if: always()
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Veille du $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
